<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion des commandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="container py-4">
  <h1 class="mb-4">Gestion des commandes</h1>

  <div id="error" class="alert alert-danger d-none"></div>

  <div id="stats" class="row g-3 mb-4"></div>

  <div class="row g-2 mb-4">
    <div class="col-md-4">
      <input id="search" type="text" class="form-control" placeholder="Rechercher un client...">
    </div>
    <div class="col-md-4">
      <select id="statusFilter" class="form-select">
        <option value="">Tous les statuts</option>
        <option value="Livree">Livree</option>
        <option value="En attente">En attente</option>
        <option value="Annulee">Annulee</option>
      </select>
    </div>
    <div class="col-md-4">
      <select id="categoryFilter" class="form-select">
        <option value="">Toutes les catégories</option>
      </select>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr><th>N°</th><th>Client</th><th>Date</th><th>Statut</th><th>Total</th><th></th></tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>
</div>

    <script type="module" src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
