<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Gestion des commandes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Gestion des commandes</h1>

    <div id="error" class="alert alert-danger d-none"></div>

    <div id="stats" class="row g-3 mb-4"></div>

    <div class="row g-2 mb-4">
      <div class="col-md-4">
        <input id="search" type="text" class="form-control" placeholder="Rechercher un client...">
      </div>
      <div class="col-md-4">
        <select id="statusFilter" class="form-select">
          <option value="">Tous les statuts</option>
          <option value="Livree">Livree</option>
          <option value="En attente">En attente</option>
          <option value="Annulee">Annulee</option>
        </select>
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select">
          <option value="">Toutes les catégories</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr><th>N°</th><th>Client</th><th>Date</th><th>Statut</th><th>Total</th><th></th></tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>


  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
